ont-weight="400" fill="#1a1a19">risk shown on screen</text><path d="M 1084 250 L 1084 278 L 136 278 L 136 252" fill="none" stroke="#1a1a19" stroke-width="1.6" marker-end="url(#ah)"/><text x="610" y="295" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a1a19">inventory, pipeline orders and backorders carry into week t+1</text><text x="4" y="268" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a19">c</text><text x="26" y="268" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1a1a19">One session — the week above, repeated</text><rect x="26" y="290" width="1168" height="26" fill="white" stroke="#1a1a19" stroke-width="1.3"/><rect x="26" y="290" width="166.857" height="26" fill="#eceae3" stroke="#1a1a19" stroke-width="1.3"/><text x="109.429" y="307" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1a1a19">practice 5</text><text x="693.429" y="307" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a1a19">30 main weeks</text><line x1="376.4" y1="316" x2="376.4" y2="325" stroke="#9a9890" stroke-width="2.4"/><line x1="476.514" y1="316" x2="476.514" y2="325" stroke="#9a9890" stroke-width="2.4"/><line x1="610" y1="316" x2="610" y2="325" stroke="#9a9890" stroke-width="2.4"/><line x1="743.486" y1="316" x2="743.486" y2="325" stroke="#9a9890" stroke-width="2.4"/><line x1="876.971" y1="316" x2="876.971" y2="325" stroke="#9a9890" stroke-width="2.4"/><line x1="1043.83" y1="316" x2="1043.83" y2="325" stroke="#9a9890" stroke-width="2.4"/><text x="693.429" y="342" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="